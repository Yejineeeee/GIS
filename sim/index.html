<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드론 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">
<style>
  html, body { margin:0; height:100%; background:#111; color:#eee;
               font-family:"Malgun Gothic", sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .box { position:absolute; z-index:10; background:rgba(16,16,16,.9);
         border:1px solid #333; border-radius:8px; padding:11px 13px; font-size:13px; }
  #panel { left:12px; top:12px; width:300px; }
  #hud { right:12px; top:12px; width:260px; font-family:Consolas, monospace;
         font-size:12px; color:#9ad; white-space:pre; }
  h1 { font-size:14px; margin:0 0 8px; }
  button { background:#2b6; border:0; color:#042; font-weight:700;
           padding:6px 11px; border-radius:6px; cursor:pointer; font-size:12px;
           margin:2px 2px 0 0; }
  button.off { background:#444; color:#bbb; }
  .hint { color:#999; font-size:12px; line-height:1.5; }
  kbd { background:#2a2a2a; border:1px solid #444; border-radius:3px;
        padding:0 4px; font-size:11px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel" class="box">
  <h1>드론 시뮬레이터 — 모래고개입구</h1>
  <div class="hint">
    <kbd>W</kbd><kbd>S</kbd> 앞뒤 &nbsp; <kbd>A</kbd><kbd>D</kbd> 좌우 &nbsp;
    <kbd>Q</kbd><kbd>E</kbd> 위아래<br>
    <kbd>←</kbd><kbd>→</kbd> 기수 &nbsp; <kbd>↑</kbd><kbd>↓</kbd> 카메라 각도
  </div>
  <div style="margin-top:9px">
    <button id="fly">자동 비행</button>
    <button id="smoke">연기 켜기</button>
    <button id="grab">프레임 뽑기</button>
    <button id="bld" class="off">건물 켜기</button>
  </div>
  <div class="hint" id="note" style="margin-top:8px">준비 중</div>
</div>

<div id="hud" class="box">기다리는 중</div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script src="token.js" onerror="void 0"></script>
<script>
// 시연 지역. 주소 뒤에 ?site=jagok 를 붙이면 자곡동으로 연다 (docs/demo_area.md).
// FIRE 는 연기를 피울 자리이고 이 좌표가 정답이다. 탐지가 낸 좌표와 비교한다.
// 자곡동 발화점은 자연녹지(실제 활엽수림) 안, 주거지역에서 62m, 반경 50m 안 건물 0채다.
const SITES = {
  moraegogae: { site: { lon: 128.906239, lat: 37.736790 }, fire: { lon: 128.9089, lat: 37.7331 },
                buildings: "buildings.geojson", tag: "" },
  jagok:      { site: { lon: 127.1017, lat: 37.4716 }, fire: { lon: 127.101707, lat: 37.470338 },
                buildings: "buildings_jagok.geojson", tag: "jagok" },
};
const SITE_KEY = new URLSearchParams(location.search).get("site") || "moraegogae";
const CFG = SITES[SITE_KEY] || SITES.moraegogae;
const SITE = CFG.site;
const FIRE = CFG.fire;
const SAVE_Q = CFG.tag ? "?site=" + CFG.tag : "";     // 저장 폴더를 지역별로 나눈다
const TOKEN = (window.CESIUM_ION_TOKEN || "").trim();

let viewer, smokeEntity = null, flying = false, aglOffset = 120;
let buildingsDS = null;

async function boot() {
  let terrain, baseLayer, note;
  if (TOKEN) {
    Cesium.Ion.defaultAccessToken = TOKEN;
    try {
      terrain = await Cesium.createWorldTerrainAsync();
      baseLayer = Cesium.ImageryLayer.fromProviderAsync(Cesium.createWorldImageryAsync());
      note = "실제 고도 + 위성 영상";
    } catch (e) { note = "토큰 오류: " + e.message; }
  }
  if (!baseLayer) {
    baseLayer = Cesium.ImageryLayer.fromProviderAsync(
      Promise.resolve(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/" })));
    note = note || "토큰 없음. 평평한 지형과 지도 타일";
  }

  viewer = new Cesium.Viewer("map", {
    baseLayer, terrainProvider: terrain,
    baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, timeline:false, animation:false, infoBox:false,
    selectionIndicator:false, fullscreenButton:false,
    // 이것이 꺼져 있으면 그림을 화면에 올린 뒤 캔버스 버퍼가 비워진다. 그 뒤에
    // toDataURL 로 읽으면 검은 판이 나온다. 프레임을 저장하므로 켜 둔다.
    contextOptions: { webgl: { preserveDrawingBuffer: true } },
  });
  window.__viewer = viewer;
  viewer.scene.globe.depthTestAgainstTerrain = true;   // 연기가 산에 가리게
  document.getElementById("note").textContent = note;

  // 발화 지점 남쪽 상공에서 시작한다
  setDrone(FIRE.lon - 0.0045, FIRE.lat - 0.0040, 120, 40, -18);
  bindKeys();
  await settle(40);
  hud();
}

// 지면 기준 고도로 드론을 놓는다. 지형 고도를 더해 타원체 높이로 바꾼다.
function setDrone(lon, lat, agl, headingDeg, pitchDeg) {
  aglOffset = agl;
  const ground = groundHeight(lon, lat);
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, (ground ?? 0) + agl),
    orientation: { heading: Cesium.Math.toRadians(headingDeg),
                   pitch: Cesium.Math.toRadians(pitchDeg), roll: 0 },
  });
}

function groundHeight(lon, lat) {
  const h = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lon, lat));
  return (h === undefined) ? null : h;
}

// 창이 뒤에 있으면 렌더가 멈춰 지형 값을 못 읽는다. 읽기 전에 강제로 그린다.
async function settle(n = 20) {
  for (let i = 0; i < n; i++) {
    viewer.scene.render();
    await new Promise(r => setTimeout(r, 70));
    const c = Cesium.Cartographic.fromCartesian(viewer.camera.positionWC);
    if (viewer.scene.globe.tilesLoaded &&
        viewer.scene.globe.getHeight(c) !== undefined) return true;
  }
  return false;
}

// ---------- 건물 ----------
// V-World LT_C_SPBD 로 받은 건물 바닥면을 층수만큼 세운다. 높이 칸이 없어
// 층당 3m 로 어림한 값이 height_m 에 들어 있다. 만드는 쪽은
// tools/make_sim_buildings.py 다.
//
// 굴뚝 시연에서 연기를 건물 옥상에 피우므로 받쳐 줄 건물이 필요하다. 없으면
// 12층 옥상 연기가 지면 36m 공중에 떠 보인다.
//
// VLM 의 답은 이것으로 달라지지 않는다. 켜고 끄고 같은 장면을 찍어 같은 질문을
// 넣어 확인했다(docs/chimney_demo.md).
async function toggleBuildings() {
  const btn = document.getElementById("bld");
  if (buildingsDS) {
    viewer.dataSources.remove(buildingsDS, true);
    buildingsDS = null;
    btn.textContent = "건물 켜기"; btn.classList.add("off");
    return;
  }
  btn.textContent = "읽는 중"; btn.disabled = true;
  try {
    const ds = await Cesium.GeoJsonDataSource.load(CFG.buildings, {
      clampToGround: false });
    for (const e of ds.entities.values) {
      if (!e.polygon) continue;
      const h = e.properties.height_m.getValue();
      // 바닥은 지형에 붙이고 거기서 h 만큼 올린다. 이 둘을 따로 주지 않으면
      // 산 위 건물이 땅에 묻히거나 공중에 뜬다.
      e.polygon.perPositionHeight = false;
      e.polygon.height = 0;
      e.polygon.heightReference = Cesium.HeightReference.CLAMP_TO_GROUND;
      e.polygon.extrudedHeight = h;
      e.polygon.extrudedHeightReference =
        Cesium.HeightReference.RELATIVE_TO_GROUND;
      e.polygon.material = Cesium.Color.fromCssColorString("#d8d2c6");
      e.polygon.outline = false;   // 2천 채에 테두리를 그리면 느려진다
    }
    viewer.dataSources.add(ds);
    buildingsDS = ds;
    btn.textContent = "건물 끄기"; btn.classList.remove("off");
    document.getElementById("note").textContent +=
      `  건물 ${ds.entities.values.length.toLocaleString()}채`;
  } catch (err) {
    // 파일이 없을 수 있다. 저장소에 올라가지 않으므로 받아 쓰는 사람은
    // make_sim_buildings.py 를 먼저 돌려야 한다.
    btn.textContent = "건물 없음";
    document.getElementById("note").textContent =
      "buildings.geojson 을 못 읽었다. tools/make_sim_buildings.py 를 먼저 돌린다";
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

// ---------- 연기 ----------
function toggleSmoke() {
  if (smokeEntity) { clearSmoke(); return; }
  lightSmoke(FIRE.lon, FIRE.lat, 2);
}

function clearSmoke() {
  if (!smokeEntity) return;
  if (smokeEntity.__ps) viewer.scene.primitives.remove(smokeEntity.__ps);
  viewer.entities.remove(smokeEntity);
  smokeEntity = null;
  const btn = document.getElementById("smoke");
  btn.textContent = "연기 켜기"; btn.classList.add("off");
  hud();
}

// agl 은 지면에서 연기가 나기 시작하는 높이다. 산불은 2m, 건물 위 연기는
// 그 건물 옥상 높이를 넣는다. 연기 자체는 어느 쪽이든 같은 것을 쓴다.
// 굴뚝 연기가 산불 연기와 어떻게 다른지 우리가 가진 데이터로는 모르므로,
// 모양을 다르게 지어내지 않는다.
function lightSmoke(lon, lat, agl) {
  if (smokeEntity) clearSmoke();
  const g = (groundHeight(lon, lat) ?? 0) + (agl === undefined ? 2 : agl);
  const pos = Cesium.Cartesian3.fromDegrees(lon, lat, g);
  smokeEntity = viewer.entities.add({
    position: pos,
    ellipsoid: { radii: new Cesium.Cartesian3(1, 1, 1), show: false },
  });
  // 연기는 입자로 그린다. 사진을 붙이면 멈춰 있어 실제 같지 않다.
  //
  // 처음에 안 보였던 이유가 둘이다. 입자 그림을 캔버스 객체로 넘겼고(데이터
  // URL 이어야 한다), 시계가 멈춰 있어 입자가 나이를 안 먹었다. 둘 다 고친다.
  viewer.clock.shouldAnimate = true;

  const base = g;
  const up = Cesium.Transforms.eastNorthUpToFixedFrame(pos);
  const rot = Cesium.Matrix4.getMatrix3(up, new Cesium.Matrix3());
  const ps = new Cesium.ParticleSystem({
    image: puffDataUrl(),
    // 아주 옅게 쌓는다. 진하게 하면 흰 풍선처럼 보인다.
    // 알파 0.12 는 눈으로 보기와 탐지가 둘 다 되는 값이다. 더 옅게 하면
    // 모델이 연기 대신 밭이나 맨땅을 집는다(알파 0.014 에서 헛탐지 10개).
    startColor: Cesium.Color.WHITE.withAlpha(0.12),
    endColor: Cesium.Color.fromCssColorString("#c8c8c8").withAlpha(0.0),
    // 처음부터 넓게 뿜는다. 작게 시작하면 발화점에 밝은 핵이 생긴다.
    startScale: 2.0,
    endScale: 13.0,
    minimumParticleLife: 11.0,
    maximumParticleLife: 24.0,
    minimumSpeed: 3.0,
    maximumSpeed: 13.0,
    imageSize: new Cesium.Cartesian2(8, 8),
    sizeInMeters: true,
    emissionRate: 240,
    // 위로 뿜는다. SphereEmitter 를 쓰면 아래로도 나가 공처럼 보인다.
    emitter: new Cesium.ConeEmitter(Cesium.Math.toRadians(20)),
    modelMatrix: up,
    lifetime: Number.MAX_VALUE,
    // 높이에 따라 바람이 세지고(바람 전단) 옆으로 더 흩어진다.
    updateCallback: function (p, dt) {
      const c = Cesium.Cartographic.fromCartesian(p.position);
      const k = Math.min(Math.max(0, c.height - base) / 80, 1);
      if (p.__j === undefined) p.__j = [Math.random() - 0.5, Math.random() - 0.5];
      const wind = 1.2 + 6.5 * k;
      const spread = 1.0 + 5.0 * k;
      const d = new Cesium.Cartesian3(
        (wind * 0.9 + p.__j[0] * spread) * dt,
        (wind * 0.42 + p.__j[1] * spread) * dt,
        0);
      Cesium.Matrix3.multiplyByVector(rot, d, d);
      Cesium.Cartesian3.add(p.position, d, p.position);
    },
  });
  viewer.scene.primitives.add(ps);
  smokeEntity.__ps = ps;
  const btn2 = document.getElementById("smoke");
  btn2.textContent = "연기 끄기"; btn2.classList.remove("off");
  hud();
}
window.lightSmoke = lightSmoke;
window.clearSmoke = clearSmoke;

// 입자에 쓸 둥근 연기 점. 캔버스 객체가 아니라 데이터 URL 로 넘긴다.
function puffDataUrl() {
  // 매끈한 원은 겹치면 덩어리로 보인다. 얼룩을 넣어 구름 무늬를 만든다.
  const n = 128, c = document.createElement("canvas");
  c.width = c.height = n;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(n, n);
  const noise = (x, y, f) =>
    Math.sin(x*f*1.7 + Math.cos(y*f*2.3)*2.1) *
    Math.cos(y*f*1.3 + Math.sin(x*f*1.9)*1.7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = (x-n/2)/(n/2), dy = (y-n/2)/(n/2);
    const r = Math.hypot(dx, dy);
    let v0 = 0.55*noise(x,y,0.06) + 0.3*noise(x,y,0.13) + 0.15*noise(x,y,0.27);
    v0 = (v0 + 1) / 2;
    const fall = Math.max(0, 1 - r);
    const a = Math.max(0, Math.min(1, fall * fall * (0.35 + 0.65 * v0)));
    const i = (y*n + x) * 4;
    img.data[i] = img.data[i+1] = img.data[i+2] = 255;
    img.data[i+3] = a * 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL("image/png");
}

// ---------- 조종 ----------
const keys = {};
function bindKeys() {
  addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  viewer.clock.onTick.addEventListener(() => {
    if (flying) return;
    const cam = viewer.camera, step = 6, turn = Cesium.Math.toRadians(1.2);
    if (keys["w"]) cam.moveForward(step);
    if (keys["s"]) cam.moveBackward(step);
    if (keys["a"]) cam.moveLeft(step);
    if (keys["d"]) cam.moveRight(step);
    if (keys["q"]) cam.moveUp(step);
    if (keys["e"]) cam.moveDown(step);
    if (keys["arrowleft"]) cam.setView({ orientation: {
      heading: cam.heading - turn, pitch: cam.pitch, roll: 0 } });
    if (keys["arrowright"]) cam.setView({ orientation: {
      heading: cam.heading + turn, pitch: cam.pitch, roll: 0 } });
    if (keys["arrowup"]) cam.setView({ orientation: {
      heading: cam.heading, pitch: Math.min(cam.pitch + turn, 0), roll: 0 } });
    if (keys["arrowdown"]) cam.setView({ orientation: {
      heading: cam.heading, pitch: Math.max(cam.pitch - turn, -Math.PI/2), roll: 0 } });
    hud();
  });
}

// ---------- 자동 비행 ----------
// 발화 지점을 끼고 도는 경로. 드론이 순찰하다 연기를 발견하는 모양이다.
async function autoFly() {
  const btn = document.getElementById("fly");
  if (flying) { flying = false; btn.textContent = "자동 비행"; return; }
  flying = true; btn.textContent = "비행 멈춤";
  const R = 0.0045, STEPS = 720;
  for (let i = 0; flying && i < STEPS; i++) {
    const t = i / STEPS * Math.PI * 2;
    const lon = FIRE.lon + R * Math.cos(t) * 1.25;
    const lat = FIRE.lat + R * Math.sin(t);
    const g = groundHeight(lon, lat) ?? 0;
    // 항상 발화 지점을 바라보게 기수를 돌린다
    const headTo = Math.atan2(FIRE.lon - lon, FIRE.lat - lat);
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, g + aglOffset),
      orientation: { heading: headTo, pitch: Cesium.Math.toRadians(-20), roll: 0 },
    });
    hud();
    await new Promise(r => setTimeout(r, 45));
  }
  flying = false; btn.textContent = "자동 비행";
}

// ---------- 값 뽑기 ----------
function cameraBlock() {
  const cam = viewer.camera;
  const c = Cesium.Cartographic.fromCartesian(cam.positionWC);
  const g = viewer.scene.globe.getHeight(c);
  return {
    lat: +Cesium.Math.toDegrees(c.latitude).toFixed(7),
    lon: +Cesium.Math.toDegrees(c.longitude).toFixed(7),
    alt_m: (g === undefined) ? null : +(c.height - g).toFixed(1),   // 지면 기준
    alt_ref: "지면",
    heading_deg: +((Cesium.Math.toDegrees(cam.heading) % 360 + 360) % 360).toFixed(1),
    pitch_deg: +Cesium.Math.toDegrees(cam.pitch).toFixed(1),
    hfov_deg: +Cesium.Math.toDegrees(cam.frustum.fov).toFixed(1),
    source: "가상",
  };
}

function hud() {
  const c = cameraBlock();
  const d = smokeEntity ? dist(c.lat, c.lon, FIRE.lat, FIRE.lon) : null;
  document.getElementById("hud").textContent =
    `위도    ${c.lat}\n경도    ${c.lon}\n` +
    `지면고도 ${c.alt_m === null ? "-" : c.alt_m + " m"}\n` +
    `기수    ${c.heading_deg}도\n카메라각 ${c.pitch_deg}도\n` +
    `화각    ${c.hfov_deg}도\n` +
    (d === null ? "\n연기 꺼짐" : `\n발화점까지 ${d.toFixed(0)} m`);
}

function dist(la1, lo1, la2, lo2) {
  const R = 6378137, dy = Cesium.Math.toRadians(la2-la1) * R;
  const dx = Cesium.Math.toRadians(lo2-lo1) * R * Math.cos(Cesium.Math.toRadians(la1));
  return Math.hypot(dx, dy);
}

// 프레임 이미지와 카메라 값을 한 벌로 내린다. 파이프라인 입력이 된다.
async function grabFrame() {
  await settle(12);
  viewer.scene.render();
  const url = viewer.canvas.toDataURL("image/png");
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  const meta = {
    schema_version: "0.3", video_id: "SIM", frame_id: Date.now() % 100000,
    time: new Date().toISOString(),
    image: `sim_${stamp}.png`,
    image_size: { width: viewer.canvas.width, height: viewer.canvas.height },
    detections: [],
    camera: cameraBlock(),
    latency_ms: { detect: null },
    // 정답. 파이프라인이 낸 좌표와 비교하려고 함께 남긴다.
    truth: smokeEntity ? { fire_lat: FIRE.lat, fire_lon: FIRE.lon } : null,
  };
  dl(url, meta.image);
  dl("data:application/json;charset=utf-8," +
     encodeURIComponent(JSON.stringify(meta, null, 2)),
     `sim_${stamp}.json`);
  window.__last = meta;
}

function dl(href, name) {
  const a = document.createElement("a");
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- 거리별 프레임 뽑기 ----------
// 시연에 쓸 거리와 고도를 정하려고 만들었다. 콘솔에서 이렇게 쓴다.
//
//     await sweep([150, 250, 350, 500], 120)
//
// 프레임은 tools/sim_server.py 로 띄웠을 때만 저장된다(POST /frame). 저장한 뒤
// tools/detect_range.py 로 어느 거리까지 잡히는지 잰다.
//
// 연기를 켜고 1분 넘게 지난 뒤에 돌려야 한다. 입자가 쌓이는 동안 기둥이 계속
// 커지므로, 덜 자란 상태에서 재면 거리 탓으로 잘못 읽게 된다.
async function shot(D, h, bearing, target) {
  bearing = (bearing === undefined) ? 225 : bearing;   // 드론이 겨냥 지점의 어느 쪽에 있나
  const T = target || FIRE;                            // 기본은 발화점
  const B = Cesium.Math.toRadians(bearing);
  const lat = T.lat + (D * Math.cos(B)) / 111320;
  const lon = T.lon + (D * Math.sin(B)) / (111320 * Math.cos(Cesium.Math.toRadians(lat)));
  const heading = (bearing + 180) % 360;               // 겨냥 지점을 바라본다

  // 지형 높이를 읽으려면 그 자리의 타일이 먼저 떠야 한다
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, 1200),
    orientation: { heading: Cesium.Math.toRadians(heading),
                   pitch: Cesium.Math.toRadians(-45), roll: 0 } });
  await settle(20);
  const g = groundHeight(lon, lat);
  if (g === null) return { ok: false, why: "지형 높이를 못 읽음" };

  const pitch = -Math.atan2(h, D) * 180 / Math.PI;     // 발화점이 화면 가운데 오게
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, g + h),
    orientation: { heading: Cesium.Math.toRadians(heading),
                   pitch: Cesium.Math.toRadians(pitch), roll: 0 } });
  await settle(20);
  for (let i = 0; i < 8; i++) {
    viewer.scene.render();
    await new Promise(r => setTimeout(r, 60));
  }

  // 마지막 한 장은 기다리지 않고 그린 자리에서 바로 읽는다. 사이에 await 가
  // 끼면 캔버스 버퍼를 잃을 수 있다.
  viewer.scene.render();
  const png = viewer.canvas.toDataURL("image/png");

  const meta = {
    schema_version: "0.3", video_id: "SWEEP", frame_id: Date.now() % 100000,
    time: new Date().toISOString(),
    image_size: { width: viewer.canvas.width, height: viewer.canvas.height },
    camera: cameraBlock(), detections: [],
    truth: { fire_lat: T.lat, fire_lon: T.lon },
    sweep: { D: D, h: h, bearing: bearing, ground_m: +g.toFixed(1) },
  };
  if (target) meta.scene = { id: target.id || null, lat: T.lat, lon: T.lon };
  const res = await fetch("/frame" + SAVE_Q, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ png: png, meta: meta }) });
  return { ok: true, saved: (await res.json()).saved, D: D, h: h,
           id: target ? (target.id || null) : null };
}

async function sweep(dists, h, bearing) {
  if (!smokeEntity) return "연기를 먼저 켠다";
  const out = [];
  for (const D of dists) out.push(await shot(D, h === undefined ? 120 : h, bearing));
  return out;
}
window.sweep = sweep;

// 지정한 지점들을 차례로 찍는다. 연기를 켜지 않고 땅만 담는다.
// VLM 이 화면에서 건물과 지형을 읽어내는지 보려고 쓴다.
async function scenes(points, D, h, bearing) {
  const out = [];
  for (const p of points) {
    out.push(await shot(D === undefined ? 300 : D, h === undefined ? 120 : h,
                        bearing, { lat: p.lat, lon: p.lon, id: p.id }));
  }
  return out;
}
window.scenes = scenes;

// ---------- 지형 높이 격자 ----------
// 시뮬레이터 프레임의 위치 오차를 잴 때 DEM 대신 쓴다. V-World 90m DEM 은
// Cesium 지형과 높이 차이가 자리마다 달라서(발화점 +13m, 드론 자리 +25~31m),
// 탐지가 밑동을 정확히 짚어도 600m 에서 94m, 800m 에서 123m 가 틀렸다.
// 시뮬레이터가 그린 지형을 그대로 뽑아 쓰면 이 오차가 없어진다.
//
//     await terrainGrid()            발화점 중심 ±1500m, 15m 간격
//
// tools/sim_server.py 로 띄웠을 때 sim/terrain.json 으로 저장되고,
// src/geo/sim_terrain.py 가 읽는다. 높이는 타원체 기준이지만 좌표 변환은
// 드론과 지면의 높이 차만 쓰므로 기준은 상관없다.
async function terrainGrid(halfM, stepM) {
  halfM = halfM || 1500;
  stepM = stepM || 15;
  const n = Math.round(2 * halfM / stepM) + 1;
  const mLat = 111320, mLon = 111320 * Math.cos(Cesium.Math.toRadians(FIRE.lat));
  const pts = [];
  for (let i = 0; i < n; i++) {          // i: 남 → 북
    for (let j = 0; j < n; j++) {        // j: 서 → 동
      const north = -halfM + i * stepM, east = -halfM + j * stepM;
      pts.push(Cesium.Cartographic.fromDegrees(
        FIRE.lon + east / mLon, FIRE.lat + north / mLat));
    }
  }
  // 화면에 그린 타일이 아니라 지형 자료의 가장 세밀한 단계에서 읽는다
  const CH = 4000;
  for (let k = 0; k < pts.length; k += CH) {
    await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, pts.slice(k, k + CH));
  }
  const heights = pts.map(p => +p.height.toFixed(2));
  const body = { lat0: FIRE.lat, lon0: FIRE.lon, half_m: halfM, step_m: stepM, n: n,
                 m_per_deg_lat: mLat, m_per_deg_lon: mLon,
                 source: "Cesium World Terrain", heights: heights };
  const res = await fetch("/terrain" + SAVE_Q, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  return { n: n, points: heights.length, saved: (await res.json()).saved };
}
window.terrainGrid = terrainGrid;

// ---------- 건물 위 연기와 산림 연기 ----------
// 같은 연기를 건물 옥상과 산림 한가운데에 두고 한 장씩 찍는다. 사진만으로
// 둘을 가릴 수 있는지, 건물 위치를 넣으면 달라지는지 보려고 만들었다.
//
// 자리는 tools/building_score.py 로 골랐다. 산림 자리는 반경 100m 안에
// 건물이 한 채도 없고, 건물 자리는 그 건물 옥상이다.
//
//     await scenes3()
const SCENES3 = [
  { id: "fire", lon: 128.904739, lat: 37.735290, agl: 2,
    note: "보전녹지지역, 반경 100m 안 건물 0채" },
  { id: "bldA", lon: 128.902294, lat: 37.744488, agl: 36,
    note: "제3종일반주거지역, 12층 건물 옥상, 반경 100m 안 39채" },
  { id: "bldB", lon: 128.901548, lat: 37.731693, agl: 6,
    note: "자연녹지지역, 2층 건물 옥상, 반경 100m 안 17채" },
];

// 입자가 쌓여 기둥이 다 자랄 때까지 기다린다. 덜 자란 상태에서 찍으면
// 장면끼리 연기 크기가 달라져 비교가 안 된다.
async function grow(ms) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    viewer.scene.render();
    await new Promise(r => setTimeout(r, 60));
  }
}

async function scenes3(D, h, bearing, growMs) {
  if (!buildingsDS) await toggleBuildings();
  const out = [];
  for (const s of SCENES3) {
    clearSmoke();
    // 연기를 피울 자리의 지형 타일을 먼저 띄워야 지면 높이를 읽는다
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, 1200),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-60), roll: 0 } });
    await settle(25);
    lightSmoke(s.lon, s.lat, s.agl);
    await grow(growMs === undefined ? 75000 : growMs);
    const r = await shot(D === undefined ? 300 : D, h === undefined ? 120 : h,
                         bearing === undefined ? 225 : bearing,
                         { lat: s.lat, lon: s.lon, id: s.id });
    out.push(Object.assign({ id: s.id, note: s.note }, r));
  }
  clearSmoke();
  return out;
}
window.scenes3 = scenes3;
window.SCENES3 = SCENES3;

document.getElementById("fly").addEventListener("click", autoFly);
document.getElementById("smoke").addEventListener("click", toggleSmoke);
document.getElementById("grab").addEventListener("click", grabFrame);
document.getElementById("bld").addEventListener("click", toggleBuildings);
boot();
</script>
